
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101321">
<title>NEXCHAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0d17;color:#f4f5ff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;min-height:100vh;background:#111526}
header{height:75px;display:flex;align-items:center;padding:0 22px;gap:12px;border-bottom:1px solid #292f45}
.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#865bff,#23d9cb);display:grid;place-items:center;font-size:23px;font-weight:bold}
.brand{font-size:21px;font-weight:900;letter-spacing:2px}
.sub{font-size:11px;color:#929bb8;margin-top:4px}
.online{margin-left:auto;color:#55e6c9;font-size:12px}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 75px)}
.sidebar{border-right:1px solid #292f45;padding:18px}
h2{font-size:19px;margin:6px 0 17px}
.search{width:100%;padding:13px;border:1px solid #303751;border-radius:13px;background:#0b1020;color:white;outline:none;margin-bottom:15px}
.search:focus{border-color:#8b70ff}
.person{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:14px;cursor:pointer}
.person:hover,.person.active{background:#242a43}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7355dc,#21b7b0);font-size:19px;font-weight:bold;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-weight:bold;font-size:14px}
.preview{color:#929bb8;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:10px;color:#7f89a8}
.chat{display:flex;flex-direction:column;min-width:0;min-height:550px}
.chathead{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid #292f45}
.chathead .name{font-size:15px}
.chatbody{padding:22px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at center,#171d31,#111526)}
.bubble{max-width:78%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.received{align-self:flex-start;background:#252b40;border-bottom-left-radius:4px}
.sent{align-self:flex-end;background:linear-gradient(135deg,#7655e9,#5848b9);border-bottom-right-radius:4px}
.btime{font-size:10px;text-align:right;color:#c3c4e6;margin-top:6px}
.composer{display:flex;gap:9px;padding:15px;border-top:1px solid #292f45}
.composer input{flex:1;min-width:0;background:#0b1020;border:1px solid #303751;border-radius:13px;padding:13px;color:white;outline:none}
.send{width:48px;border:0;border-radius:13px;background:#7b5cff;color:white;font-size:21px}
.empty{margin:auto;text-align:center;color:#a5aec9;padding:30px}
.empty .big{font-size:48px;margin-bottom:12px}
.tools{display:flex;gap:8px;margin-top:15px}
.tool{flex:1;background:#20263b;border:1px solid #343b57;border-radius:11px;padding:10px;color:#d9ddf4;font-size:12px}
.notice{text-align:center;color:#7f89a8;font-size:11px;padding:12px}
@media(max-width:650px){
.layout{grid-template-columns:1fr}
.sidebar{border-right:0;padding:14px}
.sidebar h2{margin-bottom:12px}
.people{display:flex;overflow-x:auto;gap:5px}
.person{flex-direction:column;text-align:center;min-width:83px;padding:10px 5px;gap:7px}
.person .info{width:100%}.person .preview,.person .time{display:none}
.avatar{width:47px;height:47px}
.chat{border-top:1px solid #303751;min-height:60vh}
.chatbody{min-height:280px;padding:16px}
.chathead{padding:13px 17px}
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">N</div>
<div><div class="brand">NEXCHAT</div><div class="sub">SUA CONEXÃO, SEM LIMITES</div></div>
<div class="online">● Protótipo</div>
</header>
<div class="layout">
<aside class="sidebar">
<h2>Conversas <span id="total" style="color:#8e79ff">3</span></h2>
<input id="search" class="search" placeholder="⌕  Pesquisar conversas..." oninput="searchPeople()">
<div class="people" id="people">
<div class="person active" data-name="Luna" onclick="openChat('Luna')">
<div class="avatar">L</div><div class="info"><div class="name">Luna</div><div class="preview">Oi! Tudo bem? ✨</div></div><div class="time">Agora</div>
</div>
<div class="person" data-name="Lucas" onclick="openChat('Lucas')">
<div class="avatar" style="background:linear-gradient(135deg,#ef8c56,#bd4f9e)">L</div><div class="info"><div class="name">Lucas</div><div class="preview">Bora jogar mais tarde?</div></div><div class="time">14:32</div>
</div>
<div class="person" data-name="Sofia" onclick="openChat('Sofia')">
<div class="avatar" style="background:linear-gradient(135deg,#e65caa,#7956d9)">S</div><div class="info"><div class="name">Sofia</div><div class="preview">Obrigada!! 💜</div></div><div class="time">Ontem</div>
</div>
</div>
<div class="tools">
<button class="tool" onclick="newChat()">＋ Nova conversa</button>
<button class="tool" onclick="alert('As configurações completas serão adicionadas nas próximas etapas.')">⚙ Ajustes</button>
</div>
<div class="notice">Suas conversas de demonstração ficam neste navegador.</div>
</aside>
<section class="chat">
<div class="chathead">
<div class="avatar" id="chatavatar">L</div>
<div><div class="name" id="chatname">Luna</div><div class="sub" id="chatstatus">Conversa de demonstração</div></div>
</div>
<div class="chatbody" id="messages"></div>
<form class="composer" id="form">
<input id="message" placeholder="Escreva uma mensagem..." maxlength="1000" autocomplete="off">
<button class="send" aria-label="Enviar">➤</button>
</form>
</section>
</div>
</div>
<script>
const initial={
Luna:[{text:"Oi! Tudo bem? ✨",sent:false,time:"19:01"},{text:"Bem-vindo ao NEXCHAT! Estamos começando 🚀",sent:false,time:"19:02"}],
Lucas:[{text:"Bora jogar mais tarde?",sent:false,time:"14:32"}],
Sofia:[{text:"Obrigada!! 💜",sent:false,time:"Ontem"}]
};
let chats=JSON.parse(JSON.stringify(initial));
let current="Luna";
const $=id=>document.getElementById(id);
function clock(){return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function safe(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
$("messages").innerHTML="";
(chats[current]||[]).forEach(m=>{
let b=document.createElement("div");
b.className="bubble "+(m.sent?"sent":"received");
b.innerHTML=safe(m.text)+"<div class='btime'>"+safe(m.time)+"</div>";
$("messages").appendChild(b);
});
$("messages").scrollTop=$("messages").scrollHeight;
$("chatname").textContent=current;
$("chatavatar").textContent=current[0].toUpperCase();
$("chatstatus").textContent="Conversa de demonstração";
document.querySelectorAll(".person").forEach(p=>p.classList.toggle("active",p.dataset.name===current));
}
function openChat(name){current=name;if(!chats[name])chats[name]=[];render()}
function searchPeople(){
let q=$("search").value.toLowerCase();
document.querySelectorAll(".person").forEach(p=>p.style.display=p.dataset.name.toLowerCase().includes(q)?"flex":"none");
}
$("form").addEventListener("submit",e=>{
e.preventDefault();let text=$("message").value.trim();if(!text)return;
chats[current].push({text,sent:true,time:clock()});
$("message").value="";render();save();
});
function save(){try{localStorage.setItem("nexchat-demo",JSON.stringify(chats))}catch(e){}}
try{let stored=localStorage.getItem("nexchat-demo");if(stored)chats=JSON.parse(stored)}catch(e){}
function newChat(){
let name=prompt("Nome do contato para criar uma conversa:");
if(!name)return;name=name.trim().slice(0,30);
if(!name)return;
if(!chats[name])chats[name]=[];
if(!document.querySelector('[data-name="'+CSS.escape(name)+'"]')){
let p=document.createElement("div");p.className="person";p.dataset.name=name;
p.innerHTML='<div class="avatar">'+safe(name[0].toUpperCase())+'</div><div class="info"><div class="name">'+safe(name)+'</div><div class="preview">Nova conversa</div></div><div class="time">Agora</div>';
p.onclick=()=>openChat(name);$("people").appendChild(p);
}
$("total").textContent=Object.keys(chats).length;openChat(name);save();
}
$("total").textContent=Object.keys(chats).length;
render();
</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBkWhAgqApV1qaFRBHDYXzeZm8GbLQDy4",
  authDomain: "nexchat-10f8d.firebaseapp.com",
  projectId: "nexchat-10f8d",
  storageBucket: "nexchat-10f8d.firebasestorage.app",
  messagingSenderId: "354819679455",
  appId: "1:354819679455:web:da96a884f439b3c528356a",
  measurementId: "G-T92LJGYKFN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => {
  console.log(
    user ? "NEXCHAT: usuário conectado!" : "NEXCHAT: ninguém conectado."
  );
});
</body>
</html>
